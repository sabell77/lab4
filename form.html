<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" type="text/css" href="104426.css">
    <link rel="stylesheet" type="text/css" href="theme.css">
</head>
<body>

  <h1>Registration Form</h1>

  <div class="form-container">
    <form id="registrationForm" method="post" action="registration.php" enctype="multipart/form-data" autocomplete="on">
      
      <!-- Personal Information -->
      <fieldset>
          <legend>Personal Information</legend>
          
          <div class="input-group">
              <label for="fname">First Name *</label>
              <input type="text" name="fname" id="fname" placeholder="John" autocomplete="given-name" autofocus required>
          </div>

          <div class="input-group">
              <label for="lname">Last Name *</label>
              <input type="text" name="lname" id="lname" placeholder="Doe" autocomplete="family-name" required>
          </div>

          <div class="input-group">
              <label for="email">Email Address *</label>
              <input type="email" name="email" id="email" placeholder="john.doe@example.com" autocomplete="email" required>
          </div>

          <div class="input-group">
              <label for="phone">Phone Number *</label>
              <div class="phone-container">
                  <span class="phone-prefix">+60</span>
                  <input type="tel" name="phone" id="phone" placeholder="12-345 6789" pattern="[0-9]{8,10}" title="Enter phone number without leading zero" required>
              </div>
          </div>
          
          <div class="input-group">
              <label for="dob">Date of Birth *</label>
              <input type="date" name="dob" id="dob" min="1900-01-01" max="2010-12-31" autocomplete="bday" required>
          </div>

          <div class="input-group">
              <label>Gender *</label>
              <div class="radio-options">
                  <label for="gender-m">
                      <input type="radio" name="gender" id="gender-m" value="male" required> Male
                  </label>
                  <label for="gender-f">
                      <input type="radio" name="gender" id="gender-f" value="female" required> Female
                  </label>
              </div>
          </div>
      </fieldset>

      <!-- Address Information -->
      <fieldset>
          <legend>Address Information</legend>

          <div class="input-group">
              <label for="street">Street Address *</label>
              <input type="text" name="street" id="street" placeholder="123 Jalan Ampang" autocomplete="street-address" required>
          </div>

          <div class="input-group">
              <label for="state">State *</label>
              <select name="state" id="state" autocomplete="address-level1" required>
                  <option value="" disabled selected>-- Select State / Federal Territory --</option>
                  <option value="Johor">Johor</option>
                  <option value="Kedah">Kedah</option>
                  <option value="Kelantan">Kelantan</option>
                  <option value="Melaka">Melaka</option>
                  <option value="Negeri Sembilan">Negeri Sembilan</option>
                  <option value="Pahang">Pahang</option>
                  <option value="Penang">Pulau Pinang</option>
                  <option value="Perak">Perak</option>
                  <option value="Perlis">Perlis</option>
                  <option value="Sabah">Sabah</option>
                  <option value="Sarawak">Sarawak</option>
                  <option value="Selangor">Selangor</option>
                  <option value="Terengganu">Terengganu</option>
                  <option value="Wilayah Persekutuan Kuala Lumpur">Wilayah Persekutuan Kuala Lumpur</option>
                  <option value="Wilayah Persekutuan Labuan">Wilayah Persekutuan Labuan</option>
                  <option value="Wilayah Persekutuan Putrajaya">Wilayah Persekutuan Putrajaya</option>
              </select>
          </div>

          <div class="input-group">
              <label for="city">City *</label>
              <select name="city" id="city" autocomplete="address-level2" required disabled>
                  <option value="" disabled selected>-- Select State First --</option>
              </select>
          </div>

          <div class="input-group">
              <label for="country">Country *</label>
              <input type="text" name="country" id="country" value="Malaysia" placeholder="Malaysia" autocomplete="country-name" required>
          </div>  

          <div class="input-group">
              <label for="postcode">Postcode *</label>
              <input type="text" name="postcode" id="postcode" placeholder="93000" pattern="[0-9]{5}" maxLength="5" autocomplete="postal-code" required>
          </div>              
      </fieldset>

      <!-- Account Details -->
      <fieldset>
          <legend>Create Account</legend>

          <div class="input-group">
              <label for="username">Username *</label>
              <input type="text" name="username" id="username" placeholder="johndoe123" minLength="4" maxLength="20" autocomplete="username" required>
          </div>

          <div class="input-group">
              <label for="password">Password *</label>
              
              <div class="password-group">
                  <input type="password" name="password" id="password" placeholder="Enter password" minLength="8" required>

                  <ul class="req-list">
                      <li id="req-length">✖ At least 8 characters</li>
                      <li id="req-lower">✖ At least 1 lowercase letter</li>
                      <li id="req-upper">✖ At least 1 uppercase letter</li>
                      <li id="req-num">✖ At least 1 number</li>
                      <li id="req-spec">✖ At least 1 special character (!@#$%^&*)</li>
                  </ul>
              </div>
          </div>
      </fieldset>

      <!-- Terms & Conditions -->
      <div class="input-group">
          <label for="terms">Terms and Conditions</label>
          <textarea id="terms" rows="4" readonly>
1. Introduction: Welcome to our service. By registering, you agree to these terms.
2. User Conduct: You agree to provide accurate and truthful information during registration.
3. Privacy: Your data is protected according to our privacy policy and local laws.
4. Termination: We reserve the right to modify or terminate account access for policy violations.
          </textarea>
      </div>

      <div class="input-group">
          <label for="accept" style="font-weight: normal; display: inline-flex; align-items: center; gap: 8px;">
              <input type="checkbox" name="accept" id="accept" required style="width: auto;">
              I accept the above Terms and Conditions. *
          </label>
      </div>

      <!-- Action Buttons -->
      <div class="button-group">
          <input type="submit" name="submit" value="Register">
          <input type="reset" name="reset" value="Clear">
      </div>
    </form>

    <div id="formFeedback"></div>
  </div>

  <div class="footer">
      <a href="index.html">Back to Main Page</a>
  </div>

  <!-- JavaScript file -->
  <script src="script.js"></script>
</body>
</html>
